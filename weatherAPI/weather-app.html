<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #87CEEB;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 { margin-bottom: 20px; color: #333; }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background: #4A90E2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #357ABD; }

    #result {
      margin-top: 20px;
      font-size: 16px;
      color: #333;
    }

    #error {
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌤️ Weather App</h1>

    <input type="text" id="cityInput" placeholder="Enter city name" />
    <button onclick="getWeather()">Get Weather</button>

    <div id="error"></div>

    <div id="result"></div>
  </div>

  <script>
    const API_KEY = "4082b906cdf63d7921bf3af685ae7ff6";

    function getWeather() {
      const city = document.getElementById("cityInput").value.trim();
      const resultDiv = document.getElementById("result");
      const errorDiv = document.getElementById("error");

      resultDiv.innerHTML = "";
      errorDiv.innerHTML = "";

      if (city === "") {
        errorDiv.innerHTML = "Please enter a city name.";
        return;
      }

      const url = `https://api.openweathermap.org/data/2.5/weather?appid=${API_KEY}&q=${city}&units=metric`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.cod !== 200) {
            errorDiv.innerHTML = "City not found. Try again.";
            return;
          }

          resultDiv.innerHTML = `
            <h2>${data.name}, ${data.sys.country}</h2>
            <p>🌡️ Temperature: ${data.main.temp} °C</p>
            <p>💧 Humidity: ${data.main.humidity}%</p>
            <p>☁️ Condition: ${data.weather[0].description}</p>
          `;
        })
        .catch(error => {
          errorDiv.innerHTML = "Network error. Check your connection.";
        });
    }
  </script>

</body>
</html>
